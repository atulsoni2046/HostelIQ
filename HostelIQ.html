<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HostelX — Smart College Hostel Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --accent:#17B8A6;
  --accent-ink:#04302B;
  --accent-2:#6C8CFF;
  --warn:#F2B84B;
  --danger:#F0654F;
  --success:#3FCF8E;
  --radius-s:8px;
  --radius-m:12px;
  --radius-l:18px;
  --font-head:'Manrope',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0B1220; --bg-elev:#111A2C; --bg-elev-2:#16213A; --bg-elev-3:#1C2A47;
  --border:#243052; --border-soft:#1B2540;
  --text:#E7ECF5; --text-dim:#93A0B8; --text-faint:#5C6889;
  --shadow: 0 12px 30px -14px rgba(0,0,0,.55);
}
html[data-theme="light"]{
  --bg:#F3F5F9; --bg-elev:#FFFFFF; --bg-elev-2:#F7F8FC; --bg-elev-3:#EDF0F7;
  --border:#E3E7F0; --border-soft:#ECEFF5;
  --text:#111827; --text-dim:#5B6478; --text-faint:#8A93A8;
  --shadow: 0 12px 30px -18px rgba(30,41,59,.25);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5;transition:background .25s ease,color .25s ease;}
h1,h2,h3,h4{font-family:var(--font-head);margin:0;letter-spacing:-.01em;}
button{font-family:var(--font-body);}
a{color:inherit;}
::selection{background:var(--accent);color:#04211D;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

.hidden{display:none !important;}
.tabular{font-variant-numeric:tabular-nums;}

/* ---------- Shell ---------- */
.app{display:flex;min-height:100vh;}
.sidebar{
  width:252px;flex:0 0 252px;background:var(--bg-elev);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:40;
  transition:transform .25s ease, width .25s ease;
}
.sidebar.collapsed{width:76px;flex-basis:76px;}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px;border-bottom:1px solid var(--border-soft);}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(155deg,var(--accent),#0D8F82);display:flex;align-items:center;justify-content:center;font-weight:800;color:#04241F;font-size:15px;flex:none;}
.brand-text{overflow:hidden;white-space:nowrap;}
.brand-text b{font-family:var(--font-head);font-size:15.5px;font-weight:800;display:block;}
.brand-text span{font-size:11px;color:var(--text-dim);}
.sidebar.collapsed .brand-text{display:none;}

.nav{flex:1;overflow-y:auto;padding:14px 10px;}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);padding:14px 10px 6px;font-weight:700;}
.sidebar.collapsed .nav-group-label{display:none;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--radius-s);
  color:var(--text-dim);text-decoration:none;cursor:pointer;font-size:13.5px;font-weight:600;margin-bottom:2px;
  border:1px solid transparent;white-space:nowrap;overflow:hidden;
}
.nav-item .ic{width:20px;text-align:center;flex:none;font-size:15px;}
.nav-item:hover{background:var(--bg-elev-2);color:var(--text);}
.nav-item.active{background:color-mix(in srgb, var(--accent) 14%, transparent);color:var(--accent);border-color:color-mix(in srgb, var(--accent) 30%, transparent);}
.sidebar.collapsed .nav-item span.label{display:none;}
.sidebar.collapsed .nav-item{justify-content:center;}

.sidebar-foot{padding:12px;border-top:1px solid var(--border-soft);}
.collapse-btn{width:100%;padding:8px;border-radius:var(--radius-s);border:1px solid var(--border);background:var(--bg-elev-2);color:var(--text-dim);cursor:pointer;font-size:12px;font-weight:600;}
.collapse-btn:hover{color:var(--text);}

.main{flex:1;margin-left:252px;transition:margin-left .25s ease;min-width:0;}
.sidebar.collapsed ~ .main{margin-left:76px;}

.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:12px 24px;background:color-mix(in srgb, var(--bg) 82%, transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.hamburger{display:none;border:1px solid var(--border);background:var(--bg-elev-2);border-radius:var(--radius-s);width:36px;height:36px;align-items:center;justify-content:center;cursor:pointer;color:var(--text);}
.search-trigger{
  flex:1;max-width:420px;display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:var(--radius-m);
  background:var(--bg-elev-2);border:1px solid var(--border);color:var(--text-faint);cursor:pointer;font-size:13px;
}
.search-trigger kbd{margin-left:auto;font-size:10.5px;border:1px solid var(--border);border-radius:5px;padding:2px 6px;background:var(--bg-elev-3);color:var(--text-dim);}
.topbar-spacer{flex:1;}
.icon-btn{
  position:relative;width:36px;height:36px;border-radius:var(--radius-s);border:1px solid var(--border);
  background:var(--bg-elev-2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:var(--text);flex:none;
}
.icon-btn:hover{background:var(--bg-elev-3);}
.dot-badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:700;min-width:15px;height:15px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 3px;}

.role-select{
  padding:7px 10px;border-radius:var(--radius-s);border:1px solid var(--border);background:var(--bg-elev-2);
  color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer;
}
.profile-chip{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:999px;border:1px solid var(--border);background:var(--bg-elev-2);cursor:pointer;}
.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(155deg,var(--accent-2),#4A63C4);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:none;}
.profile-chip span{font-size:12.5px;font-weight:600;}

.content{padding:22px 24px 60px;max-width:1440px;}
.view{}

/* ---------- Typography blocks ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.page-head h1{font-size:22px;font-weight:800;}
.page-head p{margin:4px 0 0;color:var(--text-dim);font-size:13.5px;max-width:560px;}
.page-head .meta{font-size:12px;color:var(--text-faint);margin-top:2px;}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--radius-s);border:1px solid var(--border);
  background:var(--bg-elev-2);color:var(--text);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;
}
.btn:hover{background:var(--bg-elev-3);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#04241F;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.btn-ghost{background:transparent;}
.btn-sm{padding:6px 10px;font-size:12px;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;}

/* ---------- Cards / Grid ---------- */
.grid{display:grid;gap:16px;}
.kpi-grid{grid-template-columns:repeat(4,1fr);}
.card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-m);padding:17px;}
.panel{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-l);padding:20px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.panel-head h3{font-size:14.5px;font-weight:700;}
.panel-head .sub{font-size:12px;color:var(--text-faint);margin-top:2px;}

.kpi-card{display:flex;flex-direction:column;gap:9px;}
.kpi-top{display:flex;align-items:center;justify-content:space-between;}
.kpi-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--bg-elev-2);}
.kpi-label{font-size:12px;color:var(--text-dim);font-weight:600;}
.kpi-value{font-size:25px;font-weight:800;font-family:var(--font-head);}
.kpi-trend{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px;width:fit-content;padding:2px 7px;border-radius:999px;}
.trend-up{color:var(--success);background:color-mix(in srgb, var(--success) 15%, transparent);}
.trend-down{color:var(--danger);background:color-mix(in srgb, var(--danger) 15%, transparent);}
.trend-flat{color:var(--warn);background:color-mix(in srgb, var(--warn) 15%, transparent);}

/* ---------- Badges / status ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.b-green{color:var(--success);background:color-mix(in srgb, var(--success) 16%, transparent);}
.b-amber{color:var(--warn);background:color-mix(in srgb, var(--warn) 18%, transparent);}
.b-red{color:var(--danger);background:color-mix(in srgb, var(--danger) 16%, transparent);}
.b-blue{color:var(--accent-2);background:color-mix(in srgb, var(--accent-2) 16%, transparent);}
.b-teal{color:var(--accent);background:color-mix(in srgb, var(--accent) 16%, transparent);}
.b-gray{color:var(--text-dim);background:var(--bg-elev-3);}

/* ---------- Tables ---------- */
.table-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.input, select.select{
  padding:8px 11px;border-radius:var(--radius-s);border:1px solid var(--border);background:var(--bg-elev-2);
  color:var(--text);font-size:13px;
}
.input{min-width:200px;flex:1;max-width:280px;}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-m);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px;}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);
  background:var(--bg-elev-2);padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;font-weight:700;cursor:pointer;user-select:none;}
thead th:hover{color:var(--text);}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border-soft);white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr{cursor:default;}
tbody tr.clickable{cursor:pointer;}
tbody tr.clickable:hover{background:var(--bg-elev-2);}
.pager{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 0;font-size:12px;color:var(--text-dim);}
.pager .btns{display:flex;gap:6px;}
.name-cell{display:flex;align-items:center;gap:9px;}
.mini-avatar{width:26px;height:26px;border-radius:50%;background:var(--bg-elev-3);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--text-dim);flex:none;}

/* ---------- Two/three col layouts ---------- */
.row-2{grid-template-columns:1.4fr 1fr;}
.row-3{grid-template-columns:repeat(3,1fr);}

/* ---------- AI insight cards ---------- */
.insight{display:flex;gap:12px;padding:13px 14px;border-radius:var(--radius-m);border:1px solid var(--border);background:var(--bg-elev-2);margin-bottom:10px;}
.insight:last-child{margin-bottom:0;}
.insight .dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px;}
.insight-title{font-size:12.5px;font-weight:700;margin-bottom:2px;}
.insight-body{font-size:12.5px;color:var(--text-dim);}

/* ---------- Room grid ---------- */
.room-floor-label{font-size:12px;font-weight:700;color:var(--text-dim);margin:14px 0 8px;}
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:9px;}
.room-tile{border:1px solid var(--border);border-radius:var(--radius-s);padding:10px 8px;cursor:pointer;background:var(--bg-elev-2);text-align:center;}
.room-tile:hover{transform:translateY(-1px);box-shadow:var(--shadow);}
.room-tile .rn{font-weight:800;font-size:13px;}
.room-tile .rs{font-size:10px;margin-top:3px;font-weight:700;}
.room-tile.st-available{border-color:color-mix(in srgb, var(--success) 45%, var(--border));}
.room-tile.st-occupied{border-color:color-mix(in srgb, var(--accent-2) 45%, var(--border));}
.room-tile.st-partial{border-color:color-mix(in srgb, var(--warn) 45%, var(--border));}
.room-tile.st-maintenance{border-color:color-mix(in srgb, var(--danger) 45%, var(--border));}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-dim);margin-top:14px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}

/* ---------- Hostel cards ---------- */
.hostel-card{display:flex;flex-direction:column;gap:12px;}
.hostel-card .h-top{display:flex;justify-content:space-between;align-items:flex-start;}
.hostel-card h4{font-size:15px;font-weight:800;}
.hostel-card .warden{font-size:12px;color:var(--text-faint);margin-top:2px;}
.occ-bar{height:7px;border-radius:999px;background:var(--bg-elev-3);overflow:hidden;}
.occ-bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));}
.hostel-stats{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-dim);}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,10,20,.55);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:100;overflow-y:auto;}
.modal{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-l);width:100%;max-width:560px;box-shadow:var(--shadow);}
.modal.wide{max-width:760px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border-soft);}
.modal-head h3{font-size:15.5px;font-weight:800;}
.modal-body{padding:20px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:16px 20px;border-top:1px solid var(--border-soft);display:flex;justify-content:flex-end;gap:10px;}
.close-x{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--bg-elev-2);cursor:pointer;color:var(--text-dim);font-size:15px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.form-field{display:flex;flex-direction:column;gap:5px;}
.form-field.full{grid-column:1/-1;}
.form-field label{font-size:11.5px;font-weight:700;color:var(--text-dim);}
.form-field input,.form-field select,.form-field textarea{
  padding:9px 11px;border-radius:var(--radius-s);border:1px solid var(--border);background:var(--bg-elev-2);color:var(--text);font-size:13px;font-family:inherit;width:100%;
}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.profile-section h4{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-bottom:8px;}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-soft);font-size:13px;}
.kv span:first-child{color:var(--text-dim);}
.kv span:last-child{font-weight:600;}

/* ---------- Command palette ---------- */
.cmdk{max-width:600px;width:100%;}
.cmdk-input{width:100%;border:none;background:transparent;padding:16px 20px;font-size:16px;color:var(--text);border-bottom:1px solid var(--border-soft);}
.cmdk-input:focus{outline:none;}
.cmdk-results{max-height:400px;overflow-y:auto;padding:8px;}
.cmdk-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-s);cursor:pointer;}
.cmdk-item:hover, .cmdk-item.sel{background:var(--bg-elev-2);}
.cmdk-item .ic{width:26px;height:26px;border-radius:7px;background:var(--bg-elev-3);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none;}
.cmdk-item .t{font-size:13.5px;font-weight:600;}
.cmdk-item .d{font-size:11.5px;color:var(--text-faint);}
.cmdk-empty{padding:30px;text-align:center;color:var(--text-faint);font-size:13px;}

/* ---------- Notifications dropdown ---------- */
.dropdown{position:absolute;top:46px;right:0;width:340px;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-m);box-shadow:var(--shadow);z-index:60;overflow:hidden;}
.dropdown-head{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-bottom:1px solid var(--border-soft);}
.dropdown-head h4{font-size:13px;font-weight:700;}
.dropdown-head button{background:none;border:none;color:var(--accent);font-size:11.5px;font-weight:700;cursor:pointer;}
.dropdown-list{max-height:360px;overflow-y:auto;}
.notif{display:flex;gap:10px;padding:12px 15px;border-bottom:1px solid var(--border-soft);cursor:pointer;}
.notif:hover{background:var(--bg-elev-2);}
.notif.unread{background:color-mix(in srgb, var(--accent) 6%, transparent);}
.notif .ic{font-size:15px;}
.notif .t{font-size:12.5px;font-weight:600;}
.notif .m{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
.wrap-rel{position:relative;}

/* ---------- AI assistant ---------- */
.ai-fab{position:fixed;bottom:22px;right:22px;z-index:70;width:56px;height:56px;border-radius:50%;border:none;
  background:linear-gradient(155deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;
  font-size:22px;cursor:pointer;box-shadow:0 14px 28px -10px rgba(23,184,166,.55);color:#04241F;}
.ai-panel{position:fixed;bottom:90px;right:22px;width:360px;max-width:90vw;height:480px;max-height:70vh;background:var(--bg-elev);
  border:1px solid var(--border);border-radius:var(--radius-l);box-shadow:var(--shadow);z-index:70;display:flex;flex-direction:column;overflow:hidden;}
.ai-head{padding:14px 16px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:center;background:var(--bg-elev-2);}
.ai-head b{font-size:13.5px;}
.ai-head .st{font-size:11px;color:var(--success);}
.ai-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.msg{max-width:85%;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.45;}
.msg.bot{background:var(--bg-elev-2);border:1px solid var(--border-soft);align-self:flex-start;border-bottom-left-radius:3px;}
.msg.user{background:var(--accent);color:#04241F;align-self:flex-end;border-bottom-right-radius:3px;font-weight:600;}
.ai-suggest{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px;}
.chip{font-size:11px;padding:5px 9px;border-radius:999px;border:1px solid var(--border);background:var(--bg-elev-2);cursor:pointer;color:var(--text-dim);}
.chip:hover{color:var(--text);border-color:var(--accent);}
.ai-input-row{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border-soft);}
.ai-input-row input{flex:1;padding:9px 12px;border-radius:999px;border:1px solid var(--border);background:var(--bg-elev-2);color:var(--text);font-size:12.5px;}
.ai-send{width:36px;height:36px;border-radius:50%;border:none;background:var(--accent);color:#04241F;font-size:14px;cursor:pointer;flex:none;}

/* ---------- Emergency ---------- */
.emergency-hero{background:linear-gradient(155deg, color-mix(in srgb, var(--danger) 18%, var(--bg-elev)), var(--bg-elev));border:1px solid color-mix(in srgb, var(--danger) 35%, var(--border));border-radius:var(--radius-l);padding:26px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;}
.contact-card{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border:1px solid var(--border);border-radius:var(--radius-s);background:var(--bg-elev-2);margin-bottom:8px;}
.contact-card:last-child{margin-bottom:0;}

/* ---------- Toast ---------- */
.toast-wrap{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--bg-elev);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius-s);padding:11px 15px;font-size:12.5px;box-shadow:var(--shadow);min-width:220px;}

/* ---------- Kanban ---------- */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.kcol-head{font-size:12px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;color:var(--text-dim);}
.kcard{background:var(--bg-elev-2);border:1px solid var(--border);border-radius:var(--radius-s);padding:11px;margin-bottom:9px;font-size:12px;}
.kcard b{display:block;font-size:12.5px;margin-bottom:4px;}
.kcard .meta{color:var(--text-faint);font-size:11px;margin-top:6px;}

/* ---------- Mess ---------- */
.mess-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
.mess-day{border:1px solid var(--border);border-radius:var(--radius-m);padding:12px;background:var(--bg-elev-2);}
.mess-day h5{font-size:12px;font-weight:800;margin-bottom:8px;}
.mess-day .meal{font-size:11px;margin-bottom:6px;}
.mess-day .meal b{display:block;color:var(--text-dim);font-size:10px;text-transform:uppercase;letter-spacing:.03em;}
.rating-bar{display:flex;align-items:center;gap:6px;}
.rating-track{flex:1;height:5px;border-radius:99px;background:var(--bg-elev-3);overflow:hidden;}
.rating-track > i{display:block;height:100%;background:var(--warn);}

/* ---------- Charts ---------- */
.chart-box{position:relative;height:230px;}
.chart-box.sm{height:180px;}

/* ---------- Personal (student/parent) dashboard ---------- */
.stat-line{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border-soft);}
.stat-line:last-child{border-bottom:none;}

/* Empty state */
.empty{padding:34px;text-align:center;color:var(--text-faint);}
.empty b{display:block;color:var(--text);font-size:13.5px;margin-bottom:4px;}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .row-2{grid-template-columns:1fr;}
  .row-3{grid-template-columns:1fr 1fr;}
  .kanban{grid-template-columns:1fr 1fr;}
}
@media (max-width:860px){
  .sidebar{transform:translateX(-100%);width:252px;flex-basis:252px;}
  .sidebar.mobile-open{transform:translateX(0);}
  .main{margin-left:0 !important;}
  .hamburger{display:flex;}
  .role-select{display:none;}
  .kpi-grid{grid-template-columns:1fr 1fr;}
  .row-3{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
  .profile-grid{grid-template-columns:1fr;}
  .kanban{grid-template-columns:1fr;}
  .mess-grid{grid-template-columns:repeat(4,1fr);}
  .content{padding:16px 14px 60px;}
  .search-trigger span.lbl{display:none;}
}
@media (max-width:520px){
  .kpi-grid{grid-template-columns:1fr;}
  .mess-grid{grid-template-columns:repeat(2,1fr);}
}

const roomFloors = [];
(function genRooms(){
  for(let f=1;f<=4;f++){
    const rooms=[];
    for(let r=1;r<=8;r++){
      const num=(f*100)+r;
      const roll=rnd(100);
      const status = roll<62?"occupied":roll<80?"available":roll<93?"partial":"maintenance";
      const cap=3;
      const occ = status==="occupied"?cap:status==="partial"?1+rnd(cap-1):0;
      rooms.push({num,status,cap,occ});
    }
    roomFloors.push({floor:f,rooms});
  }
})();

function allowedFor(item, role){ return item.roles==="*" || item.roles.includes(role); }

function renderNav(){
  const el = document.getElementById('navList');
  el.innerHTML = "";
  NAV.forEach(group=>{
    const visItems = group.items.filter(i=>allowedFor(i,state.role));
    if(!visItems.length) return;
    const lbl = document.createElement('div'); lbl.className="nav-group-label"; lbl.textContent=group.group;
    el.appendChild(lbl);
    visItems.forEach(item=>{
      const a = document.createElement('div');
      a.className = "nav-item" + (state.view===item.id?" active":"");
      a.innerHTML = `<span class="ic">${item.icon}</span><span class="label">${item.label}</span>`;
      a.onclick = ()=>{ setView(item.id); if(window.innerWidth<=860) closeMobileSidebar(); };
      el.appendChild(a);
    });
  });
  // fallback if current view not allowed for role
  const flat = NAV.flatMap(g=>g.items);
  const cur = flat.find(i=>i.id===state.view);
  if(cur && !allowedFor(cur,state.role)){ state.view="dashboard"; }
}

function closeMobileSidebar(){ document.getElementById('sidebar').classList.remove('mobile-open'); }

===================================================================== */
function setView(id){
  state.view=id;
  renderNav();
  renderContent();
  document.getElementById('content').scrollTo?.(0,0);
  window.scrollTo(0,0);
}

function renderContent(){
  const c = document.getElementById('content');
  const fns = {
    dashboard: renderDashboard, analytics: renderAnalytics, ai: renderAI,
    students: renderStudents, hostels: renderHostels, rooms: renderRooms,
    allocation: renderAllocation, attendance: renderAttendance, leave: renderLeave,
    complaints: renderComplaints, maintenance: renderMaintenance, mess: renderMess,
    visitors: renderVisitors, fees: renderFees, notices: renderNotices,
    emergency: renderEmergency, reports: renderReports, settings: renderSettings,
  };
  c.innerHTML = (fns[state.view]||renderDashboard)();
  afterRender();
}

/* =====================================================================
   SHARED HELPERS
===================================================================== */
function pageHead(title, desc, actions=""){
  return `<div class="page-head">
    <div><h1>${title}</h1><p>${desc}</p></div>
    <div class="btn-row">${actions}</div>
  </div>`;
}
function kpiCard(icon,label,value,trendVal,trendType){
  const cls = trendType==="up"?"trend-up":trendType==="down"?"trend-down":"trend-flat";
  const arrow = trendType==="up"?"↑":trendType==="down"?"↓":"→";
  return `<div class="card kpi-card">
    <div class="kpi-top"><div class="kpi-icon">${icon}</div></div>
    <div class="kpi-label">${label}</div>
    <div class="kpi-value tabular">${value}</div>
    <div class="kpi-trend ${cls}">${arrow} ${trendVal}</div>
  </div>`;
}
function badge(text,cls){ return `<span class="badge ${cls}">${text}</span>`; }
function statusBadge(status){
  const map={
    "Active":"b-green","Paid":"b-green","Approved":"b-green","Resolved":"b-green","Closed":"b-gray","Completed":"b-green","Available":"b-green","Checked-out":"b-gray",
    "Pending":"b-amber","On Leave":"b-amber","In Progress":"b-amber","Assigned":"b-blue","New":"b-blue","Partially Occupied":"b-amber",
    "Overdue":"b-red","Rejected":"b-red","Suspended":"b-red","Expired":"b-gray","Maintenance":"b-red","Occupied":"b-blue","Unassigned":"b-gray"
  };
  return badge(status, map[status]||"b-gray");
}
function priorityBadge(p){
  const map={LOW:"b-gray",MEDIUM:"b-blue",HIGH:"b-amber",CRITICAL:"b-red"};
  return badge(p, map[p]||"b-gray");
}
function initials(name){ return name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function toast(msg){
  const wrap=document.getElementById('toastWrap');
  const t=document.createElement('div'); t.className="toast"; t.textContent=msg;
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.transition="opacity .4s"; t.style.opacity="0"; setTimeout(()=>t.remove(),400); },2600);
}

      </select>

        <option value="">All Years</option>${[1,2,3,4].map(y=>`<option>Year ${y}</option>`).join("")}
      </select>
    </div>
    <div id="studentTableHolder"></div>
  </div>
  `;

function filteredStudents(){
  let rows = students.filter(s=>{
    const q = studentFilters.search.toLowerCase();
    if(q && !(s.name.toLowerCase().includes(q) || s.id.toLowerCase().includes(q))) return false;
    if(studentFilters.hostel && s.hostel!==studentFilters.hostel) return false;
    if(studentFilters.dept && s.dept!==studentFilters.dept) return false;
    if(studentFilters.year && s.year!==studentFilters.year) return false;
    return true;
  });
  rows.sort((a,b)=>{
    const k=studentFilters.sortKey;
    if(a[k]<b[k]) return -1*studentFilters.sortDir;
    if(a[k]>b[k]) return 1*studentFilters.sortDir;
    return 0;
  });
  return rows;
}
function sortStudents(key){
  if(studentFilters.sortKey===key) studentFilters.sortDir*=-1; else {studentFilters.sortKey=key; studentFilters.sortDir=1;}
  renderStudentTable();
}
function renderStudentTable(){
  const holder = document.getElementById('studentTableHolder');
  if(!holder) return;
  const rows = filteredStudents();
  const per = state.studentPerPage;
  const totalPages = Math.max(1,Math.ceil(rows.length/per));
  if(state.studentPage>totalPages) state.studentPage=totalPages;
  const start=(state.studentPage-1)*per;
  const pageRows = rows.slice(start,start+per);

  holder.innerHTML = `
  <div class="table-wrap"><table>
    <thead><tr>
      <th onclick="sortStudents('id')">Student ID</th>
      <th onclick="sortStudents('name')">Name</th>
      <th onclick="sortStudents('dept')">Department</th>
      <th onclick="sortStudents('year')">Year</th>
      <th onclick="sortStudents('hostel')">Hostel</th>
      <th onclick="sortStudents('room')">Room</th>
      <th onclick="sortStudents('status')">Status</th>
    </tr></thead>
    <tbody>
      ${pageRows.length? pageRows.map(s=>`
        <tr class="clickable" onclick="openStudentProfile('${s.id}')">
          <td class="tabular">${s.id}</td>
          <td><div class="name-cell"><div class="mini-avatar">${initials(s.name)}</div>${s.name}</div></td>
          <td>${s.dept}</td><td>${s.year}</td><td>${s.hostel}</td><td class="tabular">${s.room}</td>
          <td>${statusBadge(s.status)}</td>
        </tr>`).join("") : `<tr><td colspan="7"><div class="empty"><b>No students match your filters</b>Try clearing search or filters.</div></td></tr>`}
    </tbody>
  </table></div>
  <div class="pager">
    <span>Showing ${rows.length? (start+1):0}–${Math.min(start+per,rows.length)} of ${rows.length}</span>
    <div class="btns">
      <button class="btn btn-sm" ${state.studentPage<=1?'disabled':''} onclick="state.studentPage--;renderStudentTable();">‹ Prev</button>
      <button class="btn btn-sm" ${state.studentPage>=totalPages?'disabled':''} onclick="state.studentPage++;renderStudentTable();">Next ›</button>
    </div>
  </div>`;
}

function renderComplaintTable(){
  const holder=document.getElementById('complaintTableHolder'); if(!holder) return;
  let rows = complaints.filter(c=>{
    if(complaintFilter.cat && c.category!==complaintFilter.cat) return false;
    if(complaintFilter.status && c.status!==complaintFilter.status) return false;
    const q=complaintFilter.search.toLowerCase();
    if(q && !(c.student.toLowerCase().includes(q)||c.desc.toLowerCase().includes(q))) return false;
    return true;
  });
  holder.innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>ID</th><th>Student</th><th>Category</th><th>Hostel / Room</th><th>Priority</th><th>Status</th><th>Assigned</th></tr></thead>
    <tbody>${rows.map(c=>`<tr class="clickable" onclick='openComplaintDetail(${JSON.stringify(c)})'>
      <td class="tabular">${c.id}</td><td>${c.student}</td><td>${c.category}</td><td>${c.hostel} · ${c.room}</td>
      <td>${priorityBadge(c.priority)}</td><td>${statusBadge(c.status)}</td><td>${c.assigned}</td></tr>`).join("")||`<tr><td colspan="7"><div class="empty"><b>No complaints match</b></div></td></tr>`}</tbody>
  </table></div>`;
}

===================================================================== */
function buildSearchIndex(){
  const idx=[];
  students.forEach(s=>idx.push({type:"Student",icon:"👨‍🎓",title:s.name,desc:s.id+" · "+s.hostel,go:()=>{setView('students');setTimeout(()=>openStudentProfile(s.id),50);}}));
  HOSTELS.forEach(h=>idx.push({type:"Hostel",icon:"🏢",title:h.name,desc:h.warden,go:()=>setView('hostels')}));
  complaints.forEach(c=>idx.push({type:"Complaint",icon:"🛠",title:c.id+" — "+c.category,desc:c.student+" · "+c.status,go:()=>{setView('complaints');setTimeout(()=>openComplaintDetail(c),50);}}));
  leaves.forEach(l=>idx.push({type:"Leave",icon:"📅",title:l.id+" — "+l.student,desc:l.status,go:()=>setView('leave')}));
  fees.forEach(f=>idx.push({type:"Fee",icon:"💰",title:f.student,desc:f.status+" · ₹"+f.amount,go:()=>setView('fees')}));
  visitors.forEach(v=>idx.push({type:"Visitor",icon:"👥",title:v.name,desc:"Visiting "+v.visiting,go:()=>setView('visitors')}));
  notices.forEach(n=>idx.push({type:"Notice",icon:"📢",title:n.title,desc:n.audience,go:()=>setView('notices')}));
  NAV.flatMap(g=>g.items).forEach(n=>idx.push({type:"Page",icon:n.icon,title:n.label,desc:"Go to "+n.label,go:()=>setView(n.id)}));
  return idx;
}
let searchIndex=[];
function openCmdk(){
  searchIndex = buildSearchIndex();
  document.getElementById('cmdkOverlay').classList.remove('hidden');
  const input=document.getElementById('cmdkInput'); input.value=""; input.focus();
  renderCmdkResults("");
}
function closeCmdk(){ document.getElementById('cmdkOverlay').classList.add('hidden'); }
function renderCmdkResults(q){
  const res=document.getElementById('cmdkResults');
  q=q.toLowerCase();
  let list = q? searchIndex.filter(i=>i.title.toLowerCase().includes(q)||i.desc.toLowerCase().includes(q)) : searchIndex.filter(i=>i.type==="Page");
  list=list.slice(0,30);
  res.innerHTML = list.length? list.map((i,idx)=>`
    <div class="cmdk-item" onclick='window.__cmdkGo(${idx})'>
      <div class="ic">${i.icon}</div><div><div class="t">${i.title}</div><div class="d">${i.type} · ${i.desc}</div></div>
    </div>`).join("") : `<div class="cmdk-empty">No results for "${q}"</div>`;
  window.__cmdkList = list;
  window.__cmdkGo = (i)=>{ closeCmdk(); window.__cmdkList[i].go(); };
}

/* =====================================================================
   AI ASSISTANT (HostelAI)
===================================================================== */
function toggleAI(force){
  state.aiOpen = force!==undefined? force : !state.aiOpen;
  document.getElementById('aiPanel').classList.toggle('hidden', !state.aiOpen);
  if(state.aiOpen && !document.getElementById('aiMsgs').children.length){
    aiPush("bot","👋 Hi, I'm HostelAI. Ask me about occupancy, complaints, attendance, fees or maintenance — I read live from your hostel data.");
    renderAISuggestions();
  }
}
function renderAISuggestions(){
  const qs = ["Which rooms are available?","Show pending complaints","Who is absent today?","Which hostel has highest occupancy?","Show overdue fees","Which maintenance issues are critical?"];
  document.getElementById('aiSuggest').innerHTML = qs.map(q=>`<div class="chip" onclick="aiAsk('${q.replace(/'/g,"\\'")}')">${q}</div>`).join("");
}
function aiPush(who,text){
  const box=document.getElementById('aiMsgs');
  const d=document.createElement('div'); d.className="msg "+who; d.textContent=text;
  box.appendChild(d); box.scrollTop=box.scrollHeight;
}
function aiAsk(q){
  document.getElementById('aiInput').value=q;
  aiSendMsg();
}
function aiSendMsg(){
  const input=document.getElementById('aiInput');
  const q=input.value.trim(); if(!q) return;
  aiPush("user",q); input.value="";
  setTimeout(()=>aiPush("bot", aiAnswer(q)), 380);
}
function aiAnswer(qRaw){
  const q=qRaw.toLowerCase();
  if(q.includes("available") && q.includes("room")){
    const avail = roomFloors.flatMap(f=>f.rooms).filter(r=>r.status==="available").length;
    return `There are ${avail} fully available rooms right now in Boys Hostel A alone. Campus-wide, available beds total ${(totalBedsAll()-occupiedAll()).toLocaleString()} across ${HOSTELS.length} hostels.`;
  }
  if(q.includes("pending") && q.includes("complaint")){
    const n = complaints.filter(c=>["New","Assigned","In Progress"].includes(c.status)).length;
    const crit = complaints.filter(c=>c.priority==="CRITICAL").length;
    return `There are ${n} pending complaints, of which ${crit} are marked CRITICAL. Top category: ${topCategory()}.`;
  }
  if(q.includes("absent")){
    return `172 students (≈4%) are marked absent today. Most absences are concentrated in Boys Hostel B. Want me to open the Attendance page?`;
  }
  if(q.includes("highest occupancy") || (q.includes("hostel") && q.includes("occupancy"))){
    const top = HOSTELS.reduce((a,b)=> (a.occupied/a.totalBeds > b.occupied/b.totalBeds ? a:b));
    return `${top.name} currently has the highest occupancy at ${Math.round(top.occupied/top.totalBeds*100)}%.`;
  }
  if(q.includes("overdue") && q.includes("fee")){
    const n = fees.filter(f=>f.status==="Overdue").length;
    const amt = fees.filter(f=>f.status==="Overdue").reduce((a,f)=>a+f.amount,0);
    return `${n} students have overdue fees totalling ₹${amt.toLocaleString('en-IN')}. I can send bulk reminders from the Fees page.`;
  }
  if(q.includes("critical") && q.includes("maintenance")){
    return `Two items need urgent attention: the water pump at Girls Hostel A (83% failure probability in 30 days) and recurring corridor lighting faults at Boys Hostel B.`;
  }
  if(q.includes("summar")){
    const pend=complaints.filter(c=>["New","Assigned","In Progress"].includes(c.status)).length;
    return `Today: 4,286 students, 89.3% occupancy, ${pend} open complaints, ${leaves.filter(l=>l.status==='Pending').length} leave requests pending, and fee collection at 91.3% of target.`;
  }
  if(q.includes("mess") || q.includes("food")){
    return `Paneer quality is trending low this week at 2.8/5. Breakfast and Snacks are rated well above 4/5.`;
  }
  return `I looked through the hostel data but couldn't find a precise match for that. Try asking about room availability, complaints, attendance, fees, or maintenance.`;
}
function topCategory(){
  const counts={};
  complaints.forEach(c=>counts[c.category]=(counts[c.category]||0)+1);
  return Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
}

/* =====================================================================
   CHART INIT (Chart.js)
===================================================================== */
function destroyChart(id){ if(state.charts[id]){ state.charts[id].destroy(); delete state.charts[id]; } }
function chartDefaults(){
  const dim = getComputedStyle(document.documentElement).getPropertyValue('--text-dim').trim();
  const border = getComputedStyle(document.documentElement).getPropertyValue('--border-soft').trim();
  return {dim, border};
}
function afterRender(){
  const {dim,border} = chartDefaults();
  Chart.defaults.color = dim; Chart.defaults.borderColor = border; Chart.defaults.font.family = "Inter, system-ui, sans-serif"; Chart.defaults.font.size = 11.5;

  if(state.view==='dashboard' && state.role!=='Student' && state.role!=='Parent'){
    mkDonut('chartOccDonut', ['Occupied','Available','Reserved','Maintenance'], [occupiedAll(), totalBedsAll()-occupiedAll()-260-60, 260, 60], ['#6C8CFF','#3FCF8E','#F2B84B','#F0654F']);
    mkLine('chartOccTrend', ['Apr','May','Jun','Jul','Aug','Sep'], [[82,84,85,87,88,89.3]], ['#17B8A6'], ['Occupancy %']);
  }
  if(state.view==='analytics'){
    mkBar('chAnalytics1', HOSTELS.map(h=>h.name.replace('Hostel ','H')), [HOSTELS.map(h=>h.occupied)], ['#6C8CFF']);
    mkDonut('chAnalytics2', ['Male','Female'], [2180,2106], ['#6C8CFF','#F2B84B']);
    const catCounts = complaintCats.map(c=>complaints.filter(x=>x.category===c).length);
    mkBar('chAnalytics3', complaintCats, [catCounts], ['#F0654F']);
    mkBar('chAnalytics4', ['Apr','May','Jun','Jul','Aug','Sep'], [[28,31,26,34,30,33]], ['#3FCF8E']);
    mkLine('chAnalytics5', ['Apr','May','Jun','Jul','Aug','Sep'], [[40,44,38,46,42,48],[35,41,37,44,40,47]], ['#F0654F','#3FCF8E'], ['Received','Resolved']);
  }
  if(state.view==='ai'){
    mkLine('chOccPredict', ['Sem-2','Sem-3','Sem-4','Sem-5(proj)'], [[86,88,89.3,94]], ['#6C8CFF'], ['Occupancy %']);
  }
  if(state.view==='attendance'){
    mkDonut('chAttDonut', ['Present','Absent','Late'], [94,4,2], ['#3FCF8E','#F0654F','#F2B84B']);
    mkBar('chAttBar', HOSTELS.map(h=>h.name.replace('Hostel ','H')), [HOSTELS.map(()=>88+rnd(10))], ['#17B8A6']);
  }
  if(state.view==='students') renderStudentTable();
  if(state.view==='complaints') renderComplaintTable();
}
function mkDonut(id, labels, data, colors){
  const el=document.getElementById(id); if(!el) return; destroyChart(id);
  state.charts[id] = new Chart(el, {type:'doughnut', data:{labels, datasets:[{data, backgroundColor:colors, borderWidth:0}]},
    options:{plugins:{legend:{display:false}, tooltip:{padding:10}}, cutout:'68%', maintainAspectRatio:false}});
}
function mkBar(id, labels, datasets, colors){
  const el=document.getElementById(id); if(!el) return; destroyChart(id);
  state.charts[id] = new Chart(el, {type:'bar', data:{labels, datasets:datasets.map((d,i)=>({data:d, backgroundColor:colors[i], borderRadius:5, maxBarThickness:34}))},
    options:{plugins:{legend:{display:false}}, maintainAspectRatio:false, scales:{x:{grid:{display:false}}, y:{grid:{color:chartDefaults().border}}}}});
}
function mkLine(id, labels, datasets, colors, names){
  const el=document.getElementById(id); if(!el) return; destroyChart(id);
  state.charts[id] = new Chart(el, {type:'line', data:{labels, datasets:datasets.map((d,i)=>({data:d, borderColor:colors[i], backgroundColor:colors[i]+'22', label:names?names[i]:'', fill:true, tension:.35, pointRadius:3}))},
    options:{plugins:{legend:{display:!!(names&&names.length>1), labels:{boxWidth:10}}}, maintainAspectRatio:false, scales:{x:{grid:{display:false}}, y:{grid:{color:chartDefaults().border}}}}});
}
